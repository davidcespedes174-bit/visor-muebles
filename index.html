<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DC 3D Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #eef1f0;
      --ink: #0c211d;
      --panel: rgba(8, 27, 23, 0.92);
      --panel-2: rgba(255, 255, 255, 0.94);
      --mint: #92f2df;
      --line: #006b62;
      --soft: #dfe7e4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
    }

    #viewer {
      position: fixed;
      inset: 0;
    }

    .topbar {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 5;
      display: flex;
      gap: 10px;
      align-items: center;
      min-height: 48px;
      padding: 8px 10px;
      border-radius: 10px;
      color: white;
      background: var(--panel);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
    }

    .topbar strong {
      white-space: nowrap;
      font-size: 15px;
    }

    .topbar select,
    .topbar button {
      height: 34px;
      border: 0;
      border-radius: 8px;
      color: var(--ink);
      background: white;
      font: inherit;
      font-size: 13px;
    }

    body.client-mode #modelSelect,
    body.client-mode #openGlbBtn,
    body.client-mode #glbInput,
    body.client-mode #renameBtn {
      display: none;
    }

    body.client-mode .topbar {
      right: auto;
      max-width: calc(100vw - 28px);
    }

    .topbar select {
      min-width: 230px;
      padding: 0 10px;
    }

    .topbar button {
      padding: 0 12px;
      cursor: pointer;
    }

    .topbar button.primary {
      color: #07372f;
      background: var(--mint);
      font-weight: 700;
    }

    #glbInput {
      display: none;
    }

    .topbar .spacer {
      flex: 1;
    }

    .mobile-panel-toggle {
      display: none;
    }

    .mobile-menu-toggle {
      display: none;
    }

    .side {
      position: fixed;
      top: 76px;
      right: 14px;
      bottom: 14px;
      z-index: 6;
      width: min(390px, calc(100vw - 28px));
      display: grid;
      grid-template-rows: auto auto 1fr;
      overflow: hidden;
      border-radius: 12px;
      color: var(--ink);
      background: var(--panel-2);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.22);
    }

    .piece-card {
      padding: 16px;
      border-bottom: 1px solid var(--soft);
    }

    .piece-title {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 800;
    }

    .piece-id {
      padding: 2px 7px;
      border-radius: 999px;
      color: #075249;
      background: #d7fff6;
      font-size: 12px;
      font-weight: 800;
    }

    .muted {
      color: #60706b;
      font-size: 12px;
    }

    .dims {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .dim {
      padding: 10px;
      border: 1px solid var(--soft);
      border-radius: 8px;
      background: #f8faf9;
    }

    .dim span {
      display: block;
      color: #60706b;
      font-size: 11px;
      font-weight: 700;
    }

    .dim strong {
      display: block;
      margin-top: 3px;
      font-size: 15px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .actions button,
    .search input {
      height: 34px;
      border: 1px solid var(--soft);
      border-radius: 8px;
      background: white;
      font: inherit;
      font-size: 13px;
    }

    .actions button {
      flex: 1;
      cursor: pointer;
    }

    .actions button.danger {
      color: white;
      background: #0d5d52;
      border-color: #0d5d52;
    }

    .search {
      padding: 12px;
      border-bottom: 1px solid var(--soft);
    }

    .search input {
      width: 100%;
      padding: 0 10px;
    }

    .list {
      overflow: auto;
      padding: 6px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .row:hover,
    .row.selected {
      background: #e7f4f1;
    }

    .row.hidden {
      opacity: 0.42;
    }

    .row-title {
      font-size: 13px;
      font-weight: 750;
    }

    .row-sub {
      margin-top: 2px;
      color: #6c7975;
      font-size: 11px;
    }

    .eye {
      width: 34px;
      height: 30px;
      border: 1px solid var(--soft);
      border-radius: 8px;
      background: white;
      cursor: pointer;
    }

    .status {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 5;
      max-width: min(620px, calc(100vw - 28px));
      padding: 10px 12px;
      border-radius: 9px;
      color: white;
      background: var(--panel);
      font-size: 13px;
    }

    @media (max-width: 820px) {
      .topbar {
        display: none;
        top: calc(env(safe-area-inset-top, 0px) + 54px);
        left: 10px;
        right: 10px;
        max-height: min(46dvh, 360px);
        flex-wrap: wrap;
        gap: 6px;
        padding: 10px;
        overflow: auto;
      }

      body.mobile-menu-open .topbar {
        display: flex;
      }

      .mobile-menu-toggle {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 10px);
        left: 10px;
        z-index: 8;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        padding: 0 14px;
        border: 0;
        border-radius: 999px;
        color: var(--ink);
        background: var(--mint);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
        font: inherit;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
      }

      .topbar strong {
        font-size: 13px;
      }

      .topbar select,
      .topbar button {
        height: 32px;
        font-size: 12px;
      }

      .topbar select {
        min-width: 135px;
        flex: 1 1 135px;
      }

      .topbar button {
        padding: 0 8px;
      }

      .topbar .spacer,
      #countInfo {
        display: none;
      }

      .mobile-panel-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        color: var(--ink) !important;
        background: var(--mint) !important;
        font-weight: 700 !important;
      }

      body.client-mode .topbar {
        right: 10px;
        max-width: none;
      }

      .side {
        left: 8px;
        right: 8px;
        top: auto;
        bottom: calc(8px + env(safe-area-inset-bottom));
        width: auto;
        height: min(54dvh, 440px);
        max-height: calc(100dvh - 112px);
        display: none;
        border-radius: 14px;
      }

      .side.mobile-open {
        display: grid;
      }

      .piece-card {
        padding: 12px;
      }

      .piece-title {
        font-size: 16px;
      }

      .dims {
        gap: 6px;
        margin-top: 8px;
      }

      .dim {
        padding: 7px;
      }

      .actions {
        margin-top: 8px;
      }

      .search {
        padding: 8px 10px;
      }

      .status {
        left: 8px;
        right: 8px;
        bottom: calc(8px + env(safe-area-inset-bottom));
        max-width: none;
        font-size: 12px;
        display: none;
      }

      .status.is-visible {
        display: block;
      }
    }

    @media (max-width: 480px) {
      .topbar {
        gap: 5px;
      }

      .topbar button:not(.mobile-panel-toggle) {
        flex: 1 1 auto;
      }

      .side {
        height: min(58dvh, 500px);
        max-height: calc(100dvh - 104px);
      }
    }
    .assembly-card, .assembly-tools {
      position: fixed; left: 50%; transform: translateX(-50%); z-index: 4;
      background: #fff; color: #17302e; border-radius: 12px;
      box-shadow: 0 3px 16px #18332c35; padding: 10px 14px;
      width: max-content; max-width: calc(100vw - 32px);
    }
    .assembly-card { top: 76px; pointer-events: none; }
    .assembly-card span { display: block; font-size: .9rem; overflow-wrap: anywhere; }
    .assembly-tools { bottom: max(16px, env(safe-area-inset-bottom)); }
    .assembly-tools button[aria-pressed="true"] { background: #0f6659; color: white; }
    .assembly-tools label { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: .85rem; }
    .assembly-tools input { flex: 1; min-width: 60px; }
    body.client-mode .status { bottom: 74px; }
    @media (min-width: 821px) {
      .assembly-card, .assembly-tools {
        left: calc((100vw - 404px) / 2);
        max-width: calc(100vw - 436px);
      }
    }
    @media (max-width: 820px) {
      .assembly-card { top: 68px; }
      body.mobile-panel-open .assembly-card, body.mobile-panel-open .assembly-tools { visibility: hidden; }
    }
  
    body.share-landing .topbar > *:not(:first-child),
    body.share-landing .side { display: none !important; }
  
  </style>
</head>
<body data-hosting="static">
  <div id="viewer"></div>
  <button id="mobileMenuBtn" class="mobile-menu-toggle" type="button" aria-controls="viewerOptions" aria-expanded="false">☰ Opciones</button>

  <div class="topbar" id="viewerOptions">
    <strong>DC 3D Viewer</strong>
    <button id="mobilePanelBtn" class="mobile-panel-toggle" type="button" aria-controls="piecePanel" aria-expanded="false">Piezas</button>
    <select id="modelSelect" aria-label="Modelo" hidden></select>
    <button id="openGlbBtn" class="primary" type="button">Abrir GLB</button>
    <input id="glbInput" type="file" accept=".glb,model/gltf-binary" />
    <button id="fitBtn">Centrar</button>
    <button id="showAllBtn">Mostrar todo</button>
    <button id="hideOtherBtn" class="primary">Solo pieza</button>
    <span class="spacer"></span>
    <span id="countInfo" class="muted">Cargando...</span>
  </div>

  <aside class="side" id="piecePanel">
    <section class="piece-card">
      <h2 class="piece-title">
        <span id="pieceName">Sin seleccion</span>
        <span id="pieceId" class="piece-id">--</span>
      </h2>
      <div id="pieceLayer" class="muted">Toca una pieza o elegila en la lista.</div>
      <div class="dims">
        <div class="dim"><span>Ancho</span><strong id="dimW">--</strong></div>
        <div class="dim"><span>Alto</span><strong id="dimH">--</strong></div>
        <div class="dim"><span>Espesor</span><strong id="dimT">--</strong></div>
      </div>
      <div class="actions">
        <button id="renameBtn">Renombrar</button>
        <button id="hideBtn" class="danger">Ocultar</button>
      </div>
    </section>
    <section class="search">
      <input id="searchInput" placeholder="Buscar pieza, capa, medida..." />
    </section>
    <section id="pieceList" class="list"></section>
  </aside>

  <div id="assemblyCard" class="assembly-card" hidden aria-live="polite">
    <strong id="assemblyTitle"></strong>
    <span id="assemblyFurniture"></span>
    <span id="assemblyDimensions"></span>
  </div>
  <div id="assemblyTools" class="assembly-tools" hidden role="group" aria-label="Vista del mueble">
    <button id="xrayBtn" aria-pressed="false">Modo Rayos X</button>
    <button id="originalBtn" aria-pressed="true">Color Original</button>
    <button id="shareBtn">Compartir</button>
    <label for="explodeRange">Vista Explotada <input id="explodeRange" type="range" min="0" max="100" value="0"></label>
  </div>
  <div id="status" class="status">Preparando visor Three.js...</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const viewerEl = document.getElementById('viewer');
    const statusEl = document.getElementById('status');
    const modelSelect = document.getElementById('modelSelect');
    const glbInput = document.getElementById('glbInput');
    const pieceListEl = document.getElementById('pieceList');
    const searchInput = document.getElementById('searchInput');
    const countInfo = document.getElementById('countInfo');
    const piecePanel = document.getElementById('piecePanel');
    const mobilePanelBtn = document.getElementById('mobilePanelBtn');
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    let statusTimer = null;

    function setMobileMenuOpen(open) {
      document.body.classList.toggle('mobile-menu-open', open);
      mobileMenuBtn.setAttribute('aria-expanded', String(open));
      mobileMenuBtn.textContent = open ? 'Cerrar opciones' : '☰ Opciones';
      if (!open) setMobilePanelOpen(false);
    }

    mobileMenuBtn.addEventListener('click', () => {
      setMobileMenuOpen(!document.body.classList.contains('mobile-menu-open'));
    });

    function setMobilePanelOpen(open) {
      piecePanel.classList.toggle('mobile-open', open);
      document.body.classList.toggle('mobile-panel-open', open);
      mobilePanelBtn.setAttribute('aria-expanded', String(open));
      mobilePanelBtn.textContent = open ? 'Cerrar piezas' : 'Piezas';
    }

    mobilePanelBtn.addEventListener('click', () => {
      setMobilePanelOpen(!piecePanel.classList.contains('mobile-open'));
    });

    const ui = {
      name: document.getElementById('pieceName'),
      id: document.getElementById('pieceId'),
      layer: document.getElementById('pieceLayer'),
      w: document.getElementById('dimW'),
      h: document.getElementById('dimH'),
      t: document.getElementById('dimT'),
      hide: document.getElementById('hideBtn'),
      rename: document.getElementById('renameBtn'),
      fit: document.getElementById('fitBtn'),
      showAll: document.getElementById('showAllBtn'),
      hideOther: document.getElementById('hideOtherBtn')
    };

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0xeef1f0, 1);
    viewerEl.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
    camera.position.set(4, 3, 5);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);

    scene.add(new THREE.HemisphereLight(0xffffff, 0xb9c8c4, 2.2));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
    keyLight.position.set(6, 8, 5);
    scene.add(keyLight);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const loader = new GLTFLoader();

    let currentRoot = null;
    let pieces = [];
    let pieceById = new Map();
    let objectsByPiece = new Map();
    let selectedId = null;
    let xray = false;
    const assemblyCard = document.getElementById('assemblyCard');
    const assemblyTools = document.getElementById('assemblyTools');
    const xrayBtn = document.getElementById('xrayBtn');
    const originalBtn = document.getElementById('originalBtn');
    const explodeRange = document.getElementById('explodeRange');
    const explosion = [];
    explodeRange.addEventListener('input', () => {
      const amount = Number(explodeRange.value) / 100;
      for (const { object, origin, offset } of explosion) {
        object.position.copy(origin).addScaledVector(offset, amount);
      }
    });

    function setXray(enabled) {
      xray = enabled;
      xrayBtn.setAttribute('aria-pressed', String(enabled));
      originalBtn.setAttribute('aria-pressed', String(!enabled));
      highlightSelected();
    }

    xrayBtn.addEventListener('click', () => setXray(true));
    originalBtn.addEventListener('click', () => setXray(false));
    document.getElementById('shareBtn').addEventListener('click', async () => {
      const link = new URL(window.location.href);
      if (selectedId) link.searchParams.set('pieza', selectedId);
      try {
        if (navigator.share && matchMedia('(pointer: coarse)').matches) {
          await navigator.share({ title: document.title, url: link.href });
        } else {
          await navigator.clipboard.writeText(link.href);
          setStatus('Enlace copiado.');
        }
      } catch (error) {
        if (error.name !== 'AbortError') window.prompt('Copiá el enlace del proyecto', link.href);
      }
    });
    let activeManifest = null;
    let down = { x: 0, y: 0 };
    const shareParams = new URLSearchParams(window.location.search);
    const sharedProjectId = shareParams.get('proyecto');
    const sharedPieceId = shareParams.get('pieza');
    const isClientView = /^[a-f0-9]{24}$/i.test(sharedProjectId || '');
    if (isClientView) document.body.classList.add('client-mode');

    function setStatus(message) {
      statusEl.textContent = message;
      statusEl.classList.add('is-visible');
      if (statusTimer) window.clearTimeout(statusTimer);
      statusTimer = window.setTimeout(() => statusEl.classList.remove('is-visible'), 5000);
    }

    function assetPath(kind, name) {
      return `assets/${kind}/${name}`;
    }

    function materialPieceId(material) {
      const name = material?.name || '';
      const match = name.match(/^DC_PIECE_(P\d+)_(SURFACE|LINES)$/);
      return match ? match[1] : null;
    }

    function pieceDimensions(piece) {
      const d = piece?.dimensionsMm || {};
      return {
        width: Number(d.length || piece?.width || 0),
        height: Number(d.width || piece?.height || 0),
        thickness: Number(d.thickness || piece?.depth || 0)
      };
    }

    function registerObject(object, includeUnlabeled = false) {
      if (!object.isMesh) return;
      const mats = Array.isArray(object.material) ? object.material : [object.material];
      let pieceId = object.userData.forcedPieceId || mats.map(materialPieceId).find(Boolean);

      if (!pieceId) {
        for (let node = object; node; node = node.parent) {
          // GLTFLoader sanitizes Object3D names; use the original glTF name.
          const sourceName = node.userData.dc3dSourceName || node.name;
          if (pieceById.has(sourceName)) {
            object.name = sourceName;
            pieceId = sourceName;
            break;
          }
          const match = sourceName?.match(/\[DC3D:([A-Za-z0-9_-]+)\]/);
          if (match) {
            pieceId = match[1];
            break;
          }
          if (node === currentRoot) break;
        }
      }

      if (!pieceId && includeUnlabeled) {
        let pieceNode = object;
        while (pieceNode.parent && pieceNode.parent !== currentRoot) {
          pieceNode = pieceNode.parent;
        }
        if (pieceNode === currentRoot) pieceNode = object;

        pieceId = pieceNode.userData.dcPieceId;
        if (!pieceId) {
          let nextIndex = pieces.length + 1;
          do {
            pieceId = `P${String(nextIndex).padStart(3, '0')}`;
            nextIndex += 1;
          } while (pieceById.has(pieceId));
          pieceNode.userData.dcPieceId = pieceId;
          const namedMesh = pieceNode.name ? null : (() => {
            let found = null;
            pieceNode.traverse((child) => {
              if (!found && child.isMesh && child.name) found = child.name;
            });
            return found;
          })();
          const piece = activeManifest?.pieces?.find((entry) => entry.id === pieceId) || {
            id: pieceId,
            displayName: pieceNode.name || namedMesh || `Pieza ${pieces.length + 1}`,
            sourceLayer: 'GLB de SketchUp',
            kind: 'objeto'
          };
          pieces.push(piece);
          pieceById.set(pieceId, piece);
        }
      }
      if (pieceId && includeUnlabeled && !pieceById.has(pieceId)) {
        const piece = activeManifest?.pieces?.find((entry) => entry.id === pieceId) || {
          id: pieceId,
          displayName: object.name || pieceId,
          sourceLayer: 'GLB importado',
          kind: 'objeto'
        };
        pieces.push(piece);
        pieceById.set(pieceId, piece);
      }
      if (!pieceId) return;
      if (!includeUnlabeled && !pieceById.has(pieceId)) return;

      object.userData.pieceId = pieceId;
      if (isClientView) {
        if (!object.geometry.getAttribute('normal')) object.geometry.computeVertexNormals();
        object.add(new THREE.LineSegments(
          new THREE.EdgesGeometry(object.geometry, 15),
          new THREE.LineBasicMaterial({ color: 0x26343b, transparent: true, opacity: 0.6 })
        ));
      }
      object.userData.originalMaterial = object.material;
      object.userData.originalRenderOrder = object.renderOrder;

      if (!objectsByPiece.has(pieceId)) objectsByPiece.set(pieceId, []);
      objectsByPiece.get(pieceId).push(object);
    }

    function clearScene() {
      if (currentRoot) {
        scene.remove(currentRoot);
        currentRoot.traverse((object) => {
          if (object.geometry) object.geometry.dispose();
          const highlight = object.userData.highlightMaterial;
          if (highlight) {
            for (const mat of Array.isArray(highlight) ? highlight : [highlight]) mat.dispose();
          }
        });
      }
      currentRoot = null;
      pieces = [];
      pieceById = new Map();
      objectsByPiece = new Map();
      selectedId = null;
      activeManifest = null;
      assemblyCard.hidden = true;
      assemblyTools.hidden = true;
      explosion.length = 0;
      explodeRange.value = '0';
      setXray(false);
    }

    function frameObject(object) {
      const box = new THREE.Box3().setFromObject(object);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);

      const maxSize = Math.max(size.x, size.y, size.z, 1);
      const fitHeightDistance = maxSize / (2 * Math.atan((Math.PI * camera.fov) / 360));
      const fitWidthDistance = fitHeightDistance / camera.aspect;
      const distance = 1.35 * Math.max(fitHeightDistance, fitWidthDistance);

      const direction = new THREE.Vector3(1, 0.75, 1).normalize();
      camera.position.copy(center).addScaledVector(direction, distance);
      camera.near = Math.max(distance / 100, 0.01);
      camera.far = distance * 100;
      camera.updateProjectionMatrix();
      controls.target.copy(center);
      controls.update();
    }

    async function loadModel(baseName) {
      clearScene();
      pieceListEl.innerHTML = '';
      setStatus(`Cargando ${baseName}...`);

      const modelUrl = assetPath('models', `${baseName}.glb`);
      const dataUrl = assetPath('data', `${baseName}_piezas_mm.json`);

      const piecePayload = await fetch(dataUrl).then((r) => {
        if (!r.ok) throw new Error(`No se pudo cargar ${dataUrl}`);
        return r.json();
      });

      pieces = piecePayload.pieces || [];
      pieceById = new Map(pieces.map((piece) => [piece.id, piece]));

      const gltf = await loader.loadAsync(modelUrl);
      currentRoot = gltf.scene;
      scene.add(currentRoot);
      currentRoot.traverse(registerObject);

      for (const [pieceId, objects] of objectsByPiece.entries()) {
        for (const object of objects) object.visible = true;
      }

      renderPieceList();
      frameObject(currentRoot);
      selectPiece(pieces[0]?.id || null, false);
      setStatus(`Modelo listo: ${pieces.length} piezas detectadas. Click en una pieza para seleccionarla.`);
    }

    async function loadUploadedModel(file) {
      clearScene();
      pieceListEl.replaceChildren();
      setStatus(`Cargando ${file.name}...`);

      try {
        const data = await file.arrayBuffer();
        const gltf = await new Promise((resolve, reject) => {
          loader.parse(data, '', resolve, reject);
        });
        currentRoot = gltf.scene || gltf.scenes?.[0];
        if (!currentRoot) throw new Error('El archivo GLB no contiene una escena 3D.');

        scene.add(currentRoot);
        currentRoot.traverse((object) => registerObject(object, true));
        if (pieces.length === 0) throw new Error('No se encontraron objetos 3D en el archivo.');

        let uploadedOption = modelSelect.querySelector('option[data-uploaded-model="true"]');
        if (!uploadedOption) {
          uploadedOption = document.createElement('option');
          uploadedOption.value = '__uploaded_model__';
          uploadedOption.dataset.uploadedModel = 'true';
          modelSelect.append(uploadedOption);
        }
        uploadedOption.textContent = file.name;
        modelSelect.value = uploadedOption.value;

        renderPieceList();
        frameObject(currentRoot);
        selectPiece(pieces[0]?.id || null, false);
        setStatus(`Modelo de SketchUp listo: ${pieces.length} objetos. Puedes girarlo, acercarlo y ocultar piezas.`);
      } catch (error) {
        clearScene();
        setStatus(`No se pudo abrir el GLB: ${error.message}`);
      }
    }

    async function loadPublishedProject(projectId, focusPieceId = null) {
      clearScene();
      pieceListEl.replaceChildren();
      setStatus('Cargando proyecto compartido...');
      try {
        const staticHosting = document.body.dataset.hosting === 'static';
        const base = `${staticHosting ? './proyectos' : '/projects'}/${encodeURIComponent(projectId)}`;
        const [manifestResponse, modelResponse] = await Promise.all([
          fetch(`${base}/${staticHosting ? 'datos.json' : 'manifest.json'}`, { cache: 'no-store' }),
          fetch(`${base}/${staticHosting ? 'proyecto.glb' : 'model.glb'}`, { cache: 'no-store' })
        ]);
        if (!manifestResponse.ok || !modelResponse.ok) {
          throw new Error('El enlace no existe o el proyecto todavía no terminó de publicarse.');
        }
        activeManifest = await manifestResponse.json();
        pieces = activeManifest.pieces || [];
        pieceById = new Map(pieces.map((piece) => [piece.id, piece]));
        const data = await modelResponse.arrayBuffer();
        const gltf = await new Promise((resolve, reject) => loader.parse(data, '', resolve, reject));
        currentRoot = gltf.scene || gltf.scenes?.[0];
        if (!currentRoot) throw new Error('El archivo publicado no contiene una escena 3D.');
        currentRoot.traverse((object) => {
          const nodeIndex = gltf.parser.associations.get(object)?.nodes;
          if (nodeIndex !== undefined) {
            object.userData.dc3dSourceName = gltf.parser.json.nodes[nodeIndex]?.name || '';
          }
        });
        scene.add(currentRoot);
        currentRoot.traverse((object) => registerObject(object, false));
        const center = new THREE.Box3().setFromObject(currentRoot).getCenter(new THREE.Vector3());
        for (const objects of objectsByPiece.values()) {
          const bounds = new THREE.Box3();
          for (const object of objects) bounds.expandByObject(object);
          const pieceCenter = bounds.getCenter(new THREE.Vector3());
          for (const object of objects) {
            const offset = object.parent.worldToLocal(pieceCenter.clone())
              .sub(object.parent.worldToLocal(center.clone())).multiplyScalar(0.85);
            explosion.push({ object, origin: object.position.clone(), offset });
          }
        }
        for (const objects of objectsByPiece.values()) {
          for (const object of objects) object.visible = true;
        }
        document.title = `${activeManifest.modelName || 'Proyecto'} — DC 3D Viewer`;
        renderPieceList();
        frameObject(currentRoot);
        const targetPiece = focusPieceId && objectsByPiece.has(focusPieceId) ? focusPieceId : null;
        assemblyTools.hidden = false;
        if (targetPiece) {
          setXray(true);
          selectPiece(targetPiece, false);
          setStatus(`QR · Pieza ${targetPiece} · Vista de montaje`);
        } else {
          selectPiece(null, false);
          setStatus(focusPieceId ? `La pieza ${focusPieceId} no tiene una malla identificable.` : `Proyecto listo: ${pieces.length} piezas identificadas.`);
        }
      } catch (error) {
        clearScene();
        setStatus(`No se pudo abrir el proyecto: ${error.message}`);
      }
    }

    function highlightSelected() {
      for (const [pieceId, objects] of objectsByPiece.entries()) {
        const selected = pieceId === selectedId;
        for (const object of objects) {
          const oldHighlight = object.userData.highlightMaterial;
          if (oldHighlight) {
            for (const mat of Array.isArray(oldHighlight) ? oldHighlight : [oldHighlight]) mat.dispose();
            delete object.userData.highlightMaterial;
          }
          object.material = object.userData.originalMaterial;
          object.renderOrder = object.userData.originalRenderOrder || 0;
          if (isClientView && xray) {
            const material = new THREE.MeshBasicMaterial({
              color: selected ? 0x00d4aa : 0xc5cdd2,
              transparent: true,
              opacity: selected ? 1 : 0.25,
              depthTest: !selected,
              depthWrite: false,
              side: THREE.DoubleSide
            });
            object.userData.highlightMaterial = material;
            object.material = material;
            object.renderOrder = selected ? 1000 : 0;
          } else if (selected && !isClientView) {
            const source = object.userData.originalMaterial;
            const highlight = Array.isArray(source)
              ? source.map((mat) => mat.clone())
              : source.clone();
            for (const mat of Array.isArray(highlight) ? highlight : [highlight]) {
              if (mat.emissive) mat.emissive.setHex(0xff1d1d);
              if (mat.color) mat.color.setHex(0xff4b4b);
              mat.transparent = true;
              mat.opacity = 0.82;
              mat.depthTest = false;
              mat.depthWrite = false;
              mat.side = THREE.DoubleSide;
              mat.needsUpdate = true;
            }
            object.userData.highlightMaterial = highlight;
            object.material = highlight;
            object.renderOrder = 1000;
          }
        }
      }
    }

    function selectPiece(pieceId, frame = false) {
      selectedId = pieceId;
      const piece = pieceById.get(pieceId);
      const dims = pieceDimensions(piece);
      assemblyCard.hidden = !isClientView || !piece;
      if (isClientView && piece) {
        document.getElementById('assemblyTitle').textContent = `${pieceId} · ${piece.nombre || piece.displayName || pieceId}`;
        document.getElementById('assemblyFurniture').textContent = piece.mueble || activeManifest?.modelName || '';
        const dimensions = [piece.largo_mm ?? dims.width, piece.ancho_mm ?? dims.height, piece.espesor_mm ?? dims.thickness];
        document.getElementById('assemblyDimensions').textContent = `${dimensions.join(' × ')} mm`;
      }

      ui.name.textContent = piece?.displayName || piece?.name || 'Sin seleccion';
      ui.id.textContent = pieceId || '--';
      ui.layer.textContent = piece
        ? `${piece.sourceLayer || 'Sin capa'} | ${piece.kind || 'pieza'}`
        : 'Toca una pieza o elegila en la lista.';
      const hasDimensions = piece?.dimensionsMm || piece?.width || piece?.height || piece?.depth;
      ui.w.textContent = hasDimensions ? `${Math.round(dims.width)} mm` : '--';
      ui.h.textContent = hasDimensions ? `${Math.round(dims.height)} mm` : '--';
      ui.t.textContent = hasDimensions ? `${Math.round(dims.thickness)} mm` : '--';

      highlightSelected();
      renderPieceList();

      if (window.matchMedia('(max-width: 820px)').matches && piecePanel.classList.contains('mobile-open')) {
        setMobilePanelOpen(false);
      }

      if (frame && pieceId && objectsByPiece.has(pieceId)) {
        frameObject(objectsByPiece.get(pieceId)[0]);
      }

      window.parent?.postMessage({ type: 'dc-piece-selected', pieceId, piece }, '*');
    }

    function hidePiece(pieceId, hidden) {
      const objects = objectsByPiece.get(pieceId) || [];
      for (const object of objects) object.visible = !hidden;
      renderPieceList();
      updateCount();
    }

    function isPieceHidden(pieceId) {
      const objects = objectsByPiece.get(pieceId) || [];
      return objects.length > 0 && objects.every((object) => !object.visible);
    }

    function showAll() {
      for (const objects of objectsByPiece.values()) {
        for (const object of objects) object.visible = true;
      }
      renderPieceList();
      updateCount();
    }

    function hideOtherPieces() {
      if (!selectedId) return;
      for (const [pieceId, objects] of objectsByPiece.entries()) {
        for (const object of objects) object.visible = pieceId === selectedId;
      }
      renderPieceList();
      updateCount();
    }

    function updateCount() {
      const hiddenCount = pieces.filter((piece) => isPieceHidden(piece.id)).length;
      countInfo.textContent = `${pieces.length} piezas | ${hiddenCount} ocultas`;
    }

    function renderPieceList() {
      const query = searchInput.value.trim().toLowerCase();
      const filtered = pieces.filter((piece) => {
        const dims = pieceDimensions(piece);
        const text = [
          piece.id,
          piece.displayName,
          piece.sourceLayer,
          piece.kind,
          Math.round(dims.width),
          Math.round(dims.height),
          Math.round(dims.thickness)
        ].join(' ').toLowerCase();
        return text.includes(query);
      });

      const fragment = document.createDocumentFragment();
      for (const piece of filtered) {
        const dims = pieceDimensions(piece);
        const hidden = isPieceHidden(piece.id);
        const row = document.createElement('div');
        row.className = `row${piece.id === selectedId ? ' selected' : ''}${hidden ? ' hidden' : ''}`;
        const description = document.createElement('div');
        const title = document.createElement('div');
        const name = document.createElement('span');
        name.textContent = piece.displayName || piece.id;
        const id = document.createElement('span');
        id.className = 'muted';
        id.textContent = piece.id;
        title.className = 'row-title';
        title.append(name, ' ', id);
        const detail = document.createElement('div');
        detail.className = 'row-sub';
        const hasDimensions = piece?.dimensionsMm || piece?.width || piece?.height || piece?.depth;
        detail.textContent = hasDimensions
          ? `${piece.sourceLayer || ''} | ${Math.round(dims.width)} x ${Math.round(dims.height)} x ${Math.round(dims.thickness)} mm`
          : (piece.sourceLayer || 'Objeto 3D importado');
        description.append(title, detail);
        const toggle = document.createElement('button');
        toggle.className = 'eye';
        toggle.title = hidden ? 'Mostrar' : 'Ocultar';
        toggle.textContent = hidden ? 'Off' : 'On';
        row.append(description, toggle);
        row.addEventListener('click', () => selectPiece(piece.id));
        toggle.addEventListener('click', (event) => {
          event.stopPropagation();
          hidePiece(piece.id, !hidden);
        });
        fragment.appendChild(row);
      }

      pieceListEl.replaceChildren(fragment);
      updateCount();
    }

    function resize() {
      const width = viewerEl.clientWidth;
      const height = viewerEl.clientHeight;
      camera.aspect = width / Math.max(height, 1);
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
    }

    function pick(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const targets = [];
      for (const objects of objectsByPiece.values()) {
        for (const object of objects) {
          if (object.visible) targets.push(object);
        }
      }

      const hits = raycaster.intersectObjects(targets, false);
      const hit = hits.find((item) => item.object.userData.pieceId);
      if (hit) {
        if (isClientView) setXray(true);
        selectPiece(hit.object.userData.pieceId);
      }
    }

    renderer.domElement.addEventListener('pointerdown', (event) => {
      down = { x: event.clientX, y: event.clientY };
    });

    renderer.domElement.addEventListener('pointerup', (event) => {
      const moved = Math.hypot(event.clientX - down.x, event.clientY - down.y);
      if (moved <= 6) pick(event.clientX, event.clientY);
    });

    modelSelect.addEventListener('change', () => {
      if (modelSelect.value !== '__uploaded_model__') {
        loadModel(modelSelect.value).catch((error) => setStatus(error.message));
      }
    });
    document.getElementById('openGlbBtn').addEventListener('click', () => glbInput.click());
    glbInput.addEventListener('change', () => {
      const file = glbInput.files?.[0];
      if (file) loadUploadedModel(file);
      glbInput.value = '';
    });
    searchInput.addEventListener('input', renderPieceList);
    ui.fit.addEventListener('click', () => currentRoot && frameObject(currentRoot));
    ui.showAll.addEventListener('click', showAll);
    ui.hideOther.addEventListener('click', hideOtherPieces);
    ui.hide.addEventListener('click', () => selectedId && hidePiece(selectedId, !isPieceHidden(selectedId)));
    ui.rename.addEventListener('click', () => {
      if (!selectedId) return;
      const piece = pieceById.get(selectedId);
      const nextName = prompt('Nombre de pieza', piece?.displayName || selectedId);
      if (!nextName) return;
      piece.displayName = nextName.trim();
      selectPiece(selectedId);
    });

    window.addEventListener('resize', resize);
    resize();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
    if (isClientView) {
      loadPublishedProject(sharedProjectId, sharedPieceId);
    } else {
      document.body.classList.add('share-landing');
      setStatus('Abre el enlace del proyecto compartido para ver el modelo.');
    }
  </script>
</body>
</html>
